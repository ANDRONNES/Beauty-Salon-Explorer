services:
  db:
    image: postgres:18
    container_name: salon-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beautysalons
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: salon-api
    restart: always
    depends_on: 
      db: 
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=beautysalons;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: salon-client
    restart: always
    depends_on:
      - api
    ports:
      - "3000:80"
    
volumes:
  pgdata: